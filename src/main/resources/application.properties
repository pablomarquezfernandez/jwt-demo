spring.application.name=jwt-demo

# Base de datos H2 en memoria (se llena al arrancar con DataInitializer)
spring.datasource.url=jdbc:h2:mem:jwtdemo
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false

# Clave HMAC de 256 bits en Base64 para firmar los tokens (HS256).
# Solo para la demo: en producción se entrega por la variable de entorno JWT_SECRET.
# Para generar una nueva: openssl rand -base64 32
jwt.secret=${JWT_SECRET:J4sNjwV/P17WfWi7Xx6Pyu+/T6fEdEGdPW9npV8ZRio=}

# Tiempo de vida del token en minutos
jwt.expiration-minutes=15

# Tiempo de vida del refresh token en días: solo sirve para pedir un access token nuevo en /auth/refresh
jwt.refresh-expiration-days=7

# Origen del frontend Angular que puede llamar a la API desde el navegador (CORS)
cors.allowed-origin=${CORS_ALLOWED_ORIGIN:http://localhost:4200}
